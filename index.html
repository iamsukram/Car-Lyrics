<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dash Lyrics</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1519;--panel:#152229;--dim:#4d6670;--text:#dfeaec;--amber:#ffb238;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 18px/1.3 "Barlow Semi Condensed",ui-rounded,"Avenir Next Condensed",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
header{display:flex;gap:8px;padding:12px;background:var(--panel)}
input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--dim);border-radius:10px;padding:12px 14px}
button{background:var(--bg);border:1px solid var(--dim);border-radius:10px;padding:12px 16px;cursor:pointer}
button.go{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header,#title,#msg,footer{flex:none}
#view{min-height:0}
#results{flex:none;max-height:55vh;overflow:auto;background:var(--panel);border-top:1px solid var(--bg)}
#results[hidden]{display:none}
#results button{padding:14px 16px}
#results button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--bg);background:none}
#results small{display:block;color:var(--dim)}
#msg{padding:10px 14px;color:var(--dim)}
#title{padding:10px 14px 0;font-weight:700}
#view{flex:1;overflow:auto;padding:30vh 16px;scroll-behavior:smooth}
.ln{font-size:clamp(26px,6.5vw,44px);line-height:1.15;color:var(--dim);padding:8px 0;cursor:pointer;transition:color .25s,transform .25s;transform-origin:left}
.ln.on{color:var(--amber);font-weight:700;transform:scale(1.06)}
.ln.past{color:#7f979f}
#plain{white-space:pre-wrap;font-size:24px;line-height:1.4}
footer{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--panel)}
footer span{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#view{scroll-behavior:auto}.ln{transition:none}}
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Song and artist" enterkeypress autocomplete="off" aria-label="Song and artist">
  <button class="go" id="find">Search</button>
</header>
<div id="results" hidden></div>
<div id="title"></div>
<div id="msg">Search for the song you are playing, pick it, then tap Start when the song begins.</div>
<main id="view"></main>
<footer>
  <button id="play" class="go">Start</button>
  <button id="back" aria-label="Lyrics 0.5 seconds earlier">-0.5s</button>
  <button id="fwd" aria-label="Lyrics 0.5 seconds later">+0.5s</button>
  <span id="clock">0:00</span>
</footer>
<script>
const $=id=>document.getElementById(id);
let lines=[],idx=-1,base=0,started=0,running=false,wake=null;
const API="https://lrclib.net/api/search?q=";

function parseLrc(t){
  const out=[];
  for(const row of t.split("\n")){
    const m=row.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
    if(m) out.push({t:+m[1]*60+ +m[2],s:m[3].trim()});
  }
  return out;
}
const now=()=>base+(running?(performance.now()-started)/1000:0);
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

async function search(){
  const q=$("q").value.trim(); if(!q) return;
  $("msg").textContent="Searching…";
  try{
    const r=await fetch(API+encodeURIComponent(q));
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    const box=$("results"); box.innerHTML="";
    if(!data.length){$("msg").textContent="No matches. Try fewer words.";box.hidden=true;return}
    data.slice(0,15).forEach(d=>{
      const b=document.createElement("button");
      b.innerHTML="<span></span><small></small>";
      b.firstChild.textContent=d.trackName;
      b.lastChild.textContent=d.artistName+(d.syncedLyrics?" · synced":" · text only");
      b.onclick=()=>pick(d);
      box.appendChild(b);
    });
    box.hidden=false; $("msg").textContent="";
  }catch(e){$("msg").textContent="Search failed. Check your connection and try again."}
}

function pick(d){
  $("results").hidden=true;
  $("title").textContent=d.trackName+" — "+d.artistName;
  const v=$("view"); v.innerHTML=""; idx=-1; base=0; running=false; $("play").textContent="Start";
  if(d.syncedLyrics){
    lines=parseLrc(d.syncedLyrics);
    lines.forEach((l,i)=>{
      const e=document.createElement("div");
      e.className="ln"; e.textContent=l.s||"♪"; e.id="l"+i;
      e.onclick=()=>{base=l.t;started=performance.now()};
      v.appendChild(e);
    });
    $("msg").textContent="Tap Start as the song begins. Tap any line to resync.";
  }else{
    lines=[];
    const p=document.createElement("div"); p.id="plain"; p.textContent=d.plainLyrics||"No lyrics found.";
    v.appendChild(p); v.style.padding="16px";
    $("msg").textContent="No timing data for this song, so lyrics are not synced.";
    return;
  }
  $("view").style.padding="";
}

function tick(){
  if(lines.length){
    const t=now(); $("clock").textContent=fmt(t);
    let i=-1; for(let k=0;k<lines.length;k++){ if(lines[k].t<=t) i=k; else break }
    if(i!==idx){
      idx=i;
      lines.forEach((_,k)=>{const e=$("l"+k); e.className="ln"+(k===i?" on":k<i?" past":"")});
      if(i>=0) $("l"+i).scrollIntoView({block:"center"});
    }
  }
  requestAnimationFrame(tick);
}

async function toggle(){
  if(!lines.length) return;
  if(running){base=now();running=false;$("play").textContent="Start";if(wake){wake.release();wake=null}}
  else{started=performance.now();running=true;$("play").textContent="Pause";
    try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
}
$("find").onclick=search;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("play").onclick=toggle;
$("back").onclick=()=>{base-=.5};
$("fwd").onclick=()=>{base+=.5};
requestAnimationFrame(tick);
</script>
</body>
</html>
